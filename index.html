<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis - AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.4",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
        "react-markdown": "https://aistudiocdn.com/react-markdown@^9.0.1",
        "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.0"
      }
    }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif, system-ui;
        --purple-glow: #c084fc;
        --purple-deep: #a855f7;
      }
      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 5px var(--purple-glow), 0 0 10px var(--purple-glow), 0 0 15px var(--purple-glow);
        }
        50% {
          box-shadow: 0 0 10px var(--purple-deep), 0 0 20px var(--purple-deep), 0 0 30px var(--purple-deep);
        }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2.5s ease-in-out infinite;
      }

      /* Markdown styles with purple theme */
      .markdown-content h1, .markdown-content h2, .markdown-content h3 {
        border-bottom: 1px solid #581c87;
        padding-bottom: 0.3em;
        color: #e9d5ff;
      }
      .markdown-content a {
        color: #d8b4fe;
        text-decoration: underline;
      }
      .markdown-content pre {
        background-color: #1e1b2e;
        border: 1px solid #3b0764;
        color: #e9d5ff;
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
      }
      .markdown-content code {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
      .markdown-content code:not(pre > code) {
        background-color: #3b0764;
        color: #f3f4f6;
        padding: 0.2em 0.4em;
        border-radius: 0.3em;
      }

      /* Speaking animation */
      @keyframes speak-wave {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.5); }
      }
      .animate-speaking-wave .wave-bar-1 { animation: speak-wave 1.2s ease-in-out infinite 0s; }
      .animate-speaking-wave .wave-bar-2 { animation: speak-wave 1.2s ease-in-out infinite 0.2s; }
      .animate-speaking-wave .wave-bar-3 { animation: speak-wave 1.2s ease-in-out infinite 0.4s; }

      /* Slow pulse for listening footer icon */
       @keyframes pulse-slow {
            50% { opacity: 0.6; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Loader Animation */
      @keyframes pulse-and-rotate {
        0% {
          transform: scale(1) rotate(0deg);
        }
        50% {
          transform: scale(1.1) rotate(180deg);
        }
        100% {
          transform: scale(1) rotate(360deg);
        }
      }
      .animate-pulse-and-rotate {
        animation: pulse-and-rotate 2s ease-in-out infinite;
      }

      /* Subtle animation additions */
      @keyframes pop-in {
        0% { transform: scale(0.8); opacity: 0; }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: pop-in 0.3s ease-out forwards;
      }

      @keyframes slide-up-fade-in {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up-fade-in {
        animation: slide-up-fade-in 0.4s ease-out forwards;
      }

      .stagger-item {
        opacity: 0; /* Start hidden */
        animation: slide-up-fade-in 0.4s ease-out forwards;
      }
      
      @keyframes fade-in-short {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in-short {
        animation: fade-in-short 0.3s ease-in-out;
      }

      /* New Waveform Animation */
      @keyframes wave-flow {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
      }

      .wave-path {
        animation: wave-flow 18s linear infinite;
        transform: translateX(-25%);
        width: 200%;
      }
      .wave-path-2 {
         animation-duration: 22s;
         animation-direction: reverse;
      }
       .wave-path-3 {
         animation-duration: 15s;
      }
      
      /* Speaking state for waveform */
      .wave-path.speaking {
        animation-duration: 6s;
      }
      .wave-path-2.speaking {
          animation-duration: 7s;
      }
      .wave-path-3.speaking {
          animation-duration: 5s;
      }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
